<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notizblock</title>

    <meta name="theme-color" content="var(--background-primary)">

    <link rel="shortcut icon" href="./assets/icons/notebook-fav.svg" type="image/x-icon">

    <script src="./script.js"></script>
    <script src="./scripts/templates.js"></script>

    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body onload="init()">
    <main>
        <header>
            <h1>Notizblock</h1>
            <button onclick="openDialog()"><img src="./assets/icons/trash-button.svg" alt="trash can icon"></button>
        </header>

        <section class="input-container">
            <input id="note_title_input" type="text" placeholder="Neuer Titel">

            <select id="title_select">
                <option value="">Titel auswählen</option>
            </select>

            <input id="note_input" type="text" placeholder="Notiz eingeben">
            <button onclick="addNote()">Speichern</button>
        </section>
        <h2>Notizen:</h2>
        <section id="content"></section>
        <dialog id="trash_can" onclick="closeDialog()">
            <div onclick="stopBubbling(event)">
                <header>
                    <h2>Papierkorb:</h2>
                    <button id="close_button" onclick="closeDialog()">x</button>

                </header>
                <section id="trash_content"></section>
            </div>
        </dialog>
    </main>
</body>

</html>
