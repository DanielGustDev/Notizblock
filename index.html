<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notizblock</title>

    <link rel=" icon" type="image/x-icon" href="./assets/icons/notbook_icon.svg">

    <script src="./script.js"></script>
    <script src="./scripts/templates.js"></script>

    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body onload="init()">
    <main>
        <h1>Notizblock</h1>
        <div class="input-container">
            <input id="note_title_input" type="text" placeholder="Neuer Titel">

            <select id="title_select">
                <option value="">Titel auswählen</option>
            </select>

            <input id="note_input" type="text" placeholder="Notiz eingeben">
            <button onclick="addNote()">Notiz speichern</button>
        </div>
        <h2>Notizen</h2>
        <div id="content">

        </div>
        <h2>Papierkorb</h2>
        <div id="trash_content">

        </div>
    </main>
</body>

</html>
